[project]
name = "ai-gateway"
version = "0.0.1"
description = "로컬 판단 기반 AI 보안·비용 게이트웨이"
readme = "README.md"
requires-python = ">=3.11"
# 의존성은 기능을 구현할 때 `uv add`로 추가한다 (M1부터)
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "onnxruntime==1.31.0",
    "openai>=3.46.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.67.0",
    "tokenizers==0.23.3",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # 저장소 최상위에서 `gateway` 패키지를 import

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
