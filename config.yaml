# 게이트웨이 설정
# - 비밀값(API 키)은 여기 넣지 않는다 → .env
# - 판단 엔진 값의 근거는 docs/ollaya-notes.md (Ollaya v0.18.0 공식 문서 기준)

# 보안 수준: basic(기본) | strict(엄격) | local(완전 로컬, 옵션)
security_level: basic

gateway:
  host: 127.0.0.1
  port: 8000

# 판단 엔진 (D12): 원본을 봐야 하는 판단은 로컬, 가명화된 문장으로 충분한 판단은 클라우드
# 모델 비교 기록: docs/model-evaluation.md
decision:
  # 로컬 (Ollaya, /v1/systemone 형식) — 원본을 봐야 하는 판단
  engine: ollaya            # ollaya | jev
  base_url: http://127.0.0.1:11435   # Ollaya 기본 주소 (OLLAYA_HOST)
  model: gliclass:v4-edge   # Apache-2.0, ONNX, CPU (실측 메모리 2.2GB, 질문당 0.18초)
  timeout_seconds: 10
  local_questions: [has_pii, is_confidential]

  # 클라우드 (OpenAI Decisions) — 가명화된 문장만 보낸다. 키는 .env의 OPENAI_API_KEY
  cloud:
    engine: openai_decisions
    base_url: https://api.openai.com/v1
    model: gpt-6-luna
    timeout_seconds: 10
    questions: [needs_raw_value, is_risky, difficulty, intent]
    needs_raw_only_if_masked: true   # 가명화된 개인정보가 있을 때만 '원본 필요'를 묻는다 (코드 조건)
    on_refusal: block                # 위험·원본 필요 질문을 거부하면 차단
    on_routing_refusal: premium      # 난이도·의도 질문만 거부하면 고성능 (차단 대상은 위험·원본 필요 판단이 이미 잡는다, #8)
    on_error_route: cheap            # 응답 실패·시간 초과 시 대체 경로

  # 질문별 '예' 기준값: 190행 전체로 정함 (bench/results/compare-190-2026-10-28/summary.md)
  # M0 검증 확정값 (10/28, 190행 라벨 검토 완료). M2 가명화 후·M3 벤치마크에서 다시 확인한다
  thresholds:
    has_pii: 0.09            # 로컬 noul
    is_confidential: 0.12    # 로컬 noul, 엄격 수준에서 차단에 쓰인다 (재현율 12/13, 오탐 20/177)
    needs_raw_value: 0.02    # 클라우드, 가명화된 개인정보가 있을 때만
    is_risky: 0.5            # 클라우드 (판단 거부는 차단 쪽)
    difficulty_complex: 0.08 # 클라우드 score의 P(복잡). 이 값 이상이면 고성능

# 라우팅 정책
routing:
  # 신뢰도 범위는 0~1 ((K·p_max − 1)/(K − 1)). noul은 코드에서 |2p − 1|로 계산.
  # 값은 라벨 검토(#6) 후 재측정해서 정한다. 그 전까지 비워 둔다
  min_confidence: null
  # 신뢰도가 기준보다 낮을 때 보낼 안전한 경로
  low_confidence_route: premium   # premium | block
  # 차단 사유별 안내문. 사유가 여러 개면 앞선 사유의 안내문을 보낸다
  # 우선순위: 위험 → 원본 필요 → 판단 거부 → 무관 (10/31, gateway/routing/policy.py BLOCK_PRIORITY)
  block_messages:
    risky: 보안 정책에 따라 처리할 수 없는 요청입니다. AI의 설정을 바꾸거나 내부 정보를 요구하는 요청, 불법·유해한 요청은 도와드릴 수 없습니다.
    needs_raw: 개인정보의 실제 값이 있어야 하는 요청이라 외부 AI로 보내지 않았습니다. 이 계산이나 확인은 사내 시스템에서 직접 해 주세요.
    refused: 요청이 안전한지 확인하지 못해 처리하지 않았습니다. 표현을 바꿔 다시 요청해 주세요.
    off_topic: 업무와 관련 없는 질문에는 답하지 않습니다. 서비스 이용이나 업무에 관한 내용으로 다시 질문해 주세요.
    confidential: 사내 기밀로 보이는 내용이 있어 외부 AI로 보내지 않았습니다(엄격 보안 수준). 기밀 내용을 빼고 다시 요청해 주세요.
    pii_residual: 가리지 못한 개인정보(이름·주소 등)가 남아 있을 수 있어 외부 AI로 보내지 않았습니다(엄격 보안 수준). 개인정보를 빼고 다시 요청해 주세요.
    local_error: 보안 검사를 마치지 못해 요청을 보내지 않았습니다. 잠시 후 다시 시도해 주세요.
    cloud_error: 요청 분석을 마치지 못해 처리하지 않았습니다. 잠시 후 다시 시도해 주세요.
    low_confidence: 요청을 정확히 분류하지 못해 처리하지 않았습니다. 조금 더 구체적으로 다시 요청해 주세요.

# FAQ와 정해 둔 답 (업종별 설정, D13) — 회사가 자기 FAQ로 바꿔 등록한다. 아래는 시연용 쇼핑몰
# 판단 전에 코드가 확인하고, 맞으면 LLM 없이 이 답을 돌려준다. 이 요청은 밖으로 나가지 않는다 (D12)
faq:
  max_chars: 40          # 이보다 긴 문장은 FAQ로 보지 않는다 (FAQ는 짧은 질문)
  # 이 표현이 있으면 FAQ가 아니라 업무 요청이다 ("배송 지연 사과 메일 써 줘"). 띄어쓰기는 무시한다
  exclude_words: [써줘, 써주, 짜줘, 짜주, 작성, 정리해, 만들어, 바꿔, 요약, 번역, 분석, 검토]
  entries:
    - id: shipping
      keywords: [[배송, 언제], [도착, 언제], [배송, 며칠], [운송장, 조회], [배송, 조회]]
      answer: 주문 후 영업일 기준 1~3일 안에 출발하고, 출발 후 보통 1~2일 안에 도착합니다. 배송 상황은 마이페이지 > 주문 내역에서 운송장 번호로 조회할 수 있습니다.
    - id: return_exchange
      keywords: [[반품], [교환], [환불, 어떻게]]
      answer: 상품을 받은 날부터 7일 안에 마이페이지 > 주문 내역에서 반품·교환을 신청할 수 있습니다. 단순 변심은 왕복 배송비를 고객님이 부담하시고, 불량·오배송은 무료입니다.
    - id: order_cancel
      keywords: [[주문, 취소], [결제, 취소], [취소, 가능]]
      answer: 배송 준비 전이면 마이페이지 > 주문 내역에서 바로 취소할 수 있습니다. 이미 출발한 주문은 받으신 뒤 반품으로 신청해 주세요. 카드 결제 취소는 카드사에 따라 3~5영업일이 걸립니다.
    - id: payment
      keywords: [[결제, 수단], [결제, 방법], [무통장], [할부, 결제]]
      answer: 신용·체크카드(최대 12개월 할부), 무통장 입금, 간편결제를 쓸 수 있습니다. 무통장 입금은 주문 후 24시간 안에 입금해 주세요.
    - id: cs_hours
      keywords: [[고객센터], [상담, 시간], [상담원, 연결], [상담원, 통화], [상담, 주말]]
      answer: 고객센터는 평일 오전 9시부터 오후 6시까지(점심 12~1시 제외) 운영합니다. 주말·공휴일에는 1:1 문의 게시판을 이용해 주시면 다음 영업일에 답변드립니다.

# LLM (저렴한 모델 1종 + 고성능 모델 1종) — 선택 근거 D17, 가격 출처 docs/llm-api-notes.md §1 (10/30 확인)
llm:
  base_url: https://api.openai.com/v1   # OpenAI Chat Completions. 키는 .env의 OPENAI_API_KEY
  timeout_seconds: 60
  # 가명화된 요청에 맨 앞에 붙이는 지시. 없으면 모델이 [고객1]을 "고객님"으로 바꿔 복원할 자리가 사라진다
  # 효과 측정: bench/results/placeholder-2026-10-30/
  placeholder_instruction: >-
    요청에 있는 [고객1], [전화번호1]처럼 대괄호로 표시된 토큰은 개인정보를 가린 자리표시자다.
    답변에서 그 사람이나 값을 가리킬 때는 토큰을 대괄호까지 그대로 써라.
    토큰을 '고객님' 같은 말로 바꾸거나, 새 토큰을 만들거나, 실제 값을 추측하지 마라.
  cheap:
    provider: openai
    model: gpt-6-luna
    reasoning_effort: none      # 추론 토큰은 출력 가격으로 청구되고 느려진다. 단순 요청은 추론 없이
    price_per_1m_input: 0.10    # 비용 추정용 (USD / 100만 토큰, Standard)
    price_per_1m_output: 0.50
  premium:
    provider: openai
    model: gpt-6.1-sol
    reasoning_effort: low       # gpt-6.1-sol은 none을 지원하지 않는다 (low가 가장 낮음)
    price_per_1m_input: 2.00
    price_per_1m_output: 10.00

# 민감정보 처리
masking:
  # 사용자 사전(고객명·사내 고유명사). 실제 데이터이므로 커밋하지 않는 private/ 아래에 둔다
  user_dictionary_path: private/user_dictionary.txt

# 요청 로그 (가명화된 텍스트만 저장)
storage:
  sqlite_path: data/gateway.db
