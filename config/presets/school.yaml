# 업종 프리셋: 학교 (D22) — config.yaml에서 preset: school
# 시연용 예시다. 테스트셋에 학교 문장이 없어 정확도 수치는 아직 없다

faq:
  max_chars: 40
  exclude_words: [써줘, 써주, 짜줘, 짜주, 작성, 정리해, 만들어, 바꿔, 요약, 번역, 분석, 검토]
  entries:
    - id: calendar
      keywords: [[학사, 일정], [개강, 언제], [종강, 언제], [방학, 언제], [시험, 기간]]
      answer: 학사 일정은 학교 홈페이지의 '학사 일정' 메뉴에서 확인할 수 있습니다. 중간·기말고사 기간과 휴강일도 함께 나옵니다.
    - id: grades
      keywords: [[성적, 확인], [성적, 언제], [성적, 정정], [학점, 확인]]
      answer: 성적은 학기 종료 후 포털의 '성적 조회'에서 확인할 수 있습니다. 성적 정정은 성적 공개 후 1주일 안에 담당 교수에게 신청하세요.
    - id: leave
      keywords: [[휴학], [복학]]
      answer: 휴학·복학 신청은 포털의 '학적 변동 신청'에서 할 수 있습니다. 신청 기간은 학기 시작 전 4주이고, 군 휴학은 입영 통지서를 함께 올려 주세요.
    - id: scholarship
      keywords: [[장학금]]
      answer: 교내 장학금은 학기마다 포털의 '장학 신청'에서 신청합니다. 국가장학금은 한국장학재단 누리집에서 따로 신청해야 합니다.
    - id: certificate
      keywords: [[증명서], [재학증명], [졸업증명], [성적증명]]
      answer: 재학·졸업·성적증명서는 포털의 '증명서 발급'에서 바로 출력하거나, 행정관 1층 무인 발급기에서 학생증으로 뽑을 수 있습니다.

masking:
  example_dictionary_path: config/presets/school.dictionary.example.txt
  # 회사별 식별번호 (#38): 학번 2000년대 입학 8자리 → [학번1]. 20으로 시작하는 8자리 날짜(20261105)도 가려지지만,
  # 가명화의 오탐은 복원 단계에서 되돌아온다 (재현율 우선, #11)
  custom_patterns:
    - kind: 학번
      pattern: "(?<![0-9])20[0-9]{6}(?![0-9])"
