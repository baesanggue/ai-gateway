# 업종 프리셋: 온라인 쇼핑몰 (주 시연, D22)
# config.yaml의 preset: shop이면 이 값이 기본값이 되고, config.yaml에 직접 적은 값이 우선한다

# FAQ와 정해 둔 답 (D13) — 판단 전에 코드가 확인하고, 맞으면 LLM 없이 이 답을 돌려준다. 밖으로 나가지 않는다 (D12)
faq:
  max_chars: 40          # 이보다 긴 문장은 FAQ로 보지 않는다 (FAQ는 짧은 질문)
  # 이 표현이 있으면 FAQ가 아니라 업무 요청이다 ("배송 지연 사과 메일 써 줘"). 띄어쓰기는 무시한다
  exclude_words: [써줘, 써주, 짜줘, 짜주, 작성, 정리해, 만들어, 바꿔, 요약, 번역, 분석, 검토]
  entries:
    - id: shipping
      keywords: [[배송, 언제], [도착, 언제], [배송, 며칠], [운송장, 조회], [배송, 조회]]
      answer: 주문 후 영업일 기준 1~3일 안에 출발하고, 출발 후 보통 1~2일 안에 도착합니다. 배송 상황은 마이페이지 > 주문 내역에서 운송장 번호로 조회할 수 있습니다.
    - id: return_exchange
      keywords: [[반품], [교환], [환불, 어떻게]]
      answer: 상품을 받은 날부터 7일 안에 마이페이지 > 주문 내역에서 반품·교환을 신청할 수 있습니다. 단순 변심은 왕복 배송비를 고객님이 부담하시고, 불량·오배송은 무료입니다.
    - id: order_cancel
      keywords: [[주문, 취소], [결제, 취소], [취소, 가능]]
      answer: 배송 준비 전이면 마이페이지 > 주문 내역에서 바로 취소할 수 있습니다. 이미 출발한 주문은 받으신 뒤 반품으로 신청해 주세요. 카드 결제 취소는 카드사에 따라 3~5영업일이 걸립니다.
    - id: payment
      keywords: [[결제, 수단], [결제, 방법], [무통장], [할부, 결제]]
      answer: 신용·체크카드(최대 12개월 할부), 무통장 입금, 간편결제를 쓸 수 있습니다. 무통장 입금은 주문 후 24시간 안에 입금해 주세요.
    - id: cs_hours
      keywords: [[고객센터], [상담, 시간], [상담원, 연결], [상담원, 통화], [상담, 주말]]
      answer: 고객센터는 평일 오전 9시부터 오후 6시까지(점심 12~1시 제외) 운영합니다. 주말·공휴일에는 1:1 문의 게시판을 이용해 주시면 다음 영업일에 답변드립니다.


masking:
  example_dictionary_path: config/presets/shop.dictionary.example.txt
  # 회사별 식별번호 (#38): 쇼핑몰 회원번호 M + 8자리 → [회원번호1]. 주문번호·운송장 번호는 개인정보가 아니라 가리지 않는다
  # 이름 인식 모델이 사람 이름으로 잘못 본 쇼핑몰 업무 낱말 (#65). 11/07·11/08 측정에서 실제로 잘못 가린 것만 넣었다
  # (#53·#58). 정확히 같은 낱말만 가리지 않는다. 사람 이름과 같은 낱말은 넣지 않는다
  not_names: [노쇼, 리스트, 모드, 정사이즈]
  custom_patterns:
    - kind: 회원번호
      pattern: "(?<![A-Za-z0-9])M[0-9]{8}(?![0-9])"
