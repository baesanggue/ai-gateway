# 업종 프리셋: 병원 (D22) — config.yaml에서 preset: medical
# 시연용 예시다. 실제 병원은 자기 FAQ·답·식별번호 형식으로 바꾼다

faq:
  max_chars: 40
  exclude_words: [써줘, 써주, 짜줘, 짜주, 작성, 정리해, 만들어, 바꿔, 요약, 번역, 분석, 검토]
  entries:
    - id: hours
      keywords: [[진료, 시간], [진료, 몇시], [토요일, 진료], [주말, 진료], [공휴일, 진료]]
      answer: 평일 오전 9시부터 오후 6시까지, 토요일은 오전 9시부터 오후 1시까지 진료합니다. 점심시간은 오후 1시부터 2시까지이고, 일요일·공휴일은 휴진입니다.
    - id: reservation
      keywords: [[예약, 변경], [예약, 취소], [예약, 방법], [예약, 어떻게]]
      answer: 진료 예약과 변경·취소는 병원 앱이나 홈페이지의 '나의 예약'에서 할 수 있습니다. 진료 전날 오후 6시까지 변경하시면 됩니다.
    - id: parking
      keywords: [[주차]]
      answer: 병원 지하 주차장을 이용하실 수 있습니다. 외래 진료를 받으시면 수납 창구에서 2시간 무료 주차 등록을 해 드립니다.
    - id: documents
      keywords: [[진단서], [소견서], [진료확인서], [서류, 발급], [진료비, 영수증]]
      answer: 진단서·소견서·진료확인서는 1층 원무과에서 발급합니다. 본인은 신분증을, 대리인은 위임장과 가족관계를 증명하는 서류를 가져오세요.
    - id: results
      keywords: [[검사, 결과, 언제], [결과, 나오], [결과, 확인]]
      answer: 혈액검사 결과는 보통 2~3일, 영상검사 결과는 5일 안팎에 나옵니다. 결과는 다음 외래 진료 때 담당 의사가 설명해 드립니다.

masking:
  example_dictionary_path: config/presets/medical.dictionary.example.txt
  # 회사별 식별번호 (#38): 병원 차트번호(환자 등록번호) C + 8자리 → [차트번호1]
  # 병원 안에서는 이 번호로 환자를 바로 찾을 수 있어 개인정보에 가깝다 (D19)
  # 이름 인식 모델이 사람 이름으로 잘못 본 병원 업무 낱말 (#65). 11/07·11/08 측정에서 실제로 잘못 가린 것만 넣었다
  # (#53·#58). 정확히 같은 낱말만 가리지 않는다. 사람 이름과 같은 낱말은 넣지 않는다
  not_names: [금식, 원무, 재진, 초진, 내원, 휴진, 노쇼]
  custom_patterns:
    - kind: 차트번호
      pattern: "(?<![A-Za-z0-9])C[0-9]{8}(?![0-9])"
